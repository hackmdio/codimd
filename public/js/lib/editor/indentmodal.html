<div class="modal fade indent-modal" tabindex="-1" role="dialog" aria-labelledby="indentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="indentModalLabel">Indentation</h4>
            </div>
            <div class="modal-body">
                <div class="btn-group btn-group-justified indent-modal-type" role="group">
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-default indent-modal-space">Spaces</button>
                    </div>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-default indent-modal-tab">Tab</button>
                    </div>
                </div>
                <div class="indent-modal-width">
                    <button type="button" class="btn btn-default indent-modal-minus" aria-label="Decrease indentation size"><i class="fa fa-minus fa-fw"></i></button>
                    <span class="indent-modal-value">4</span>
                    <button type="button" class="btn btn-default indent-modal-plus" aria-label="Increase indentation size"><i class="fa fa-plus fa-fw"></i></button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>
